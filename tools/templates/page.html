<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — japan-learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/wanakana@5/wanakana.min.js" defer></script>
<script src="https://unpkg.com/kuroshiro@1.2.0/dist/kuroshiro.min.js" defer></script>
<script src="https://unpkg.com/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js" defer></script>
<style>
  :root{
    --paper:#f1e8d6; --paper-2:#e9dcc2; --ink:#2b2620; --ink-soft:#6f6557;
    --vermilion:#bd3b2c; --vermilion-deep:#9c2f23; --gold:#b08a4a;
    --cell:#f7f0e0; --cell-line:#d8c8a6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Fraunces",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  .jp,article :lang(ja){font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}

  main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:36px 28px 28px}

  .top-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  nav.breadcrumb{font-size:13px;color:var(--ink-soft);letter-spacing:.04em}
  nav.breadcrumb a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
  nav.breadcrumb a:hover{border-bottom-color:var(--vermilion)}

  .romaji-toggle{font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.04em;
    padding:6px 14px;border:1px solid var(--cell-line);background:var(--cell);
    color:var(--ink);border-radius:99px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,transform .12s;white-space:nowrap}
  .romaji-toggle:hover:not(:disabled){border-color:var(--vermilion);color:var(--vermilion)}
  .romaji-toggle.on{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
  .romaji-toggle.on:hover:not(:disabled){background:var(--vermilion-deep);border-color:var(--vermilion-deep);color:#fff}
  .romaji-toggle:disabled{opacity:.65;cursor:wait}
  .romaji-status{font-size:12px;color:var(--ink-soft);min-height:1.3em;margin-bottom:18px;text-align:right;font-style:italic}
  .romaji-status.err{color:var(--vermilion-deep);font-style:normal}

  .layout{display:grid;grid-template-columns:240px 1fr;gap:48px}
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;gap:24px}
    .sidebar{order:2;border-top:1px solid var(--cell-line);padding-top:16px}
    .romaji-status{text-align:left}
  }

  aside.sidebar h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:10px}
  aside.sidebar ul{list-style:none}
  aside.sidebar li{margin-bottom:6px}
  aside.sidebar a{color:var(--ink);text-decoration:none;font-size:14px;line-height:1.45;display:block;padding:3px 0;border-left:2px solid transparent;padding-left:10px;margin-left:-12px}
  aside.sidebar a:hover{color:var(--vermilion-deep)}
  aside.sidebar a.current{color:var(--vermilion);font-weight:600;border-left-color:var(--vermilion)}

  article.content{font-size:16.5px;line-height:1.68;max-width:760px}
  article.content h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin-bottom:18px;line-height:1.18}
  article.content h2{font-size:22px;font-weight:600;margin:34px 0 12px}
  article.content h3{font-size:18px;font-weight:600;margin:24px 0 10px;color:var(--vermilion-deep)}
  article.content p{margin-bottom:14px}
  article.content ul,article.content ol{margin:0 0 16px 22px}
  article.content li{margin-bottom:6px}
  article.content blockquote{border-left:3px solid var(--gold);padding:6px 16px;margin:14px 0;background:rgba(255,255,255,.4);font-style:italic;color:var(--ink-soft)}
  article.content blockquote p{margin:0 0 6px}
  article.content blockquote p:last-child{margin:0}
  article.content code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em;background:var(--cell);padding:1px 5px;border-radius:3px}
  article.content pre{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;background:var(--cell);border:1px solid var(--cell-line);padding:12px 14px;border-radius:5px;overflow-x:auto;margin:14px 0;line-height:1.55}
  article.content pre code{background:none;padding:0}
  article.content a{color:var(--vermilion);text-decoration:none;border-bottom:1px solid rgba(189,59,44,.25);transition:border-color .15s}
  article.content a:hover{border-bottom-color:var(--vermilion)}
  article.content table{border-collapse:collapse;margin:14px 0;font-size:.95em}
  article.content th,article.content td{border:1px solid var(--cell-line);padding:6px 10px;text-align:left}
  article.content th{background:var(--cell);font-weight:600}
  article.content ruby rt{font-size:.55em;color:var(--ink-soft);font-weight:400}
  article.content ruby.romaji-added rt{color:var(--vermilion);font-weight:600;letter-spacing:.02em}
  article.content hr{border:none;border-top:1px solid var(--cell-line);margin:24px 0}

  footer{margin-top:48px;padding:24px 28px 22px;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.7;border-top:1px solid var(--cell-line)}
  footer a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
  footer a:hover{color:var(--vermilion-deep)}
</style>
</head>
<body>
<main>
  <div class="top-row">
    <nav class="breadcrumb"><a href="/">Home</a> &rsaquo; <a href="/#curriculum">Module {{MODULE_NUM}}</a></nav>
    <button id="romaji-toggle" type="button" class="romaji-toggle">Show romaji</button>
  </div>
  <div id="romaji-status" class="romaji-status"></div>
  <div class="layout">
    <aside class="sidebar">
      <h4>{{MODULE_TITLE}}</h4>
      <ul>{{SIDEBAR_LIST}}</ul>
    </aside>
    <article class="content">
      {{RENDERED_HTML}}
    </article>
  </div>
</main>
<footer>
  Last updated: {{LAST_UPDATED}} &middot;
  <a href="{{SOURCE_URL}}" target="_blank" rel="noopener">View source on GitHub</a>
</footer>

<script>
(function() {
  // ──────────────────────────────────────────────────────────────
  // Romaji-ruby toggle for module pages.
  // Reuses wanakana (kana → romaji) and kuroshiro (kanji → romaji)
  // libraries loaded via <script defer> in the page head.
  // ──────────────────────────────────────────────────────────────
  const toggleBtn = document.getElementById("romaji-toggle");
  const statusEl = document.getElementById("romaji-status");
  const article = document.querySelector("article.content");
  if (!toggleBtn || !statusEl || !article) return;

  function setStatus(msg, isError) {
    statusEl.textContent = msg || "";
    statusEl.classList.toggle("err", !!isError);
  }

  // Wait until a window-global library is defined (defer scripts may not
  // have finished by the time auto-on fires).
  function waitForLib(name) {
    return new Promise((resolve, reject) => {
      if (window[name]) return resolve(window[name]);
      let tries = 0;
      const iv = setInterval(() => {
        if (window[name]) {
          clearInterval(iv);
          resolve(window[name]);
        } else if (++tries > 400) {
          clearInterval(iv);
          reject(new Error(name + " failed to load"));
        }
      }, 50);
    });
  }

  // ──────────────────────────────────────────────────────────────
  // Pure helpers (mirrored from tools/reader.html)
  // ──────────────────────────────────────────────────────────────
  const KANJI_RE = /[一-鿿㐀-䶿]/;
  const KANA_OR_KANJI_RE = /[ぁ-んァ-ヶー一-鿿㐀-䶿]/;
  const SMALL_KANA = new Set("ぁぃぅぇぉゃゅょゎァィゥェォャュョヮ");
  const SOKUON = new Set("っッ");
  const LONG_MARK = "ー";

  function hasKanji(text) { return KANJI_RE.test(text); }

  function splitKanaIntoMorae(text) {
    const out = [];
    let i = 0;
    while (i < text.length) {
      let mora = text[i++];
      if (SOKUON.has(mora) && i < text.length) {
        let next = text[i++];
        while (i < text.length && (SMALL_KANA.has(text[i]) || text[i] === LONG_MARK)) {
          next += text[i++];
        }
        out.push(mora + next);
        continue;
      }
      while (i < text.length && (SMALL_KANA.has(text[i]) || text[i] === LONG_MARK)) {
        mora += text[i++];
      }
      out.push(mora);
    }
    return out;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function renderWithWanakana(text) {
    const morae = splitKanaIntoMorae(text);
    return morae.map(m => {
      if (/[ぁ-んァ-ヶー]/.test(m)) {
        const romaji = window.wanakana.toRomaji(m);
        return `<ruby class="romaji-added">${escapeHtml(m)}<rt>${escapeHtml(romaji)}</rt></ruby>`;
      }
      return escapeHtml(m);
    }).join("");
  }

  let kuroshiroInstance = null;
  async function getKuroshiro() {
    if (kuroshiroInstance) return kuroshiroInstance;
    setStatus("Loading kanji dictionary (~25 MB, first time only)…");
    await waitForLib("Kuroshiro");
    await waitForLib("KuromojiAnalyzer");
    kuroshiroInstance = new window.Kuroshiro();
    await kuroshiroInstance.init(new window.KuromojiAnalyzer({
      dictPath: "https://unpkg.com/kuromoji@0.1.2/dict/",
    }));
    return kuroshiroInstance;
  }

  async function renderWithKuroshiro(text) {
    const k = await getKuroshiro();
    const html = await k.convert(text, {
      mode: "furigana", to: "romaji", romajiSystem: "hepburn",
    });
    // Tag each generated ruby with our class for distinct styling.
    return html.replace(/<ruby>/g, '<ruby class="romaji-added">');
  }

  // ──────────────────────────────────────────────────────────────
  // DOM walking + per-node rubification
  // ──────────────────────────────────────────────────────────────
  // Skip <pre> (fenced code blocks — keep literal), <ruby> (existing furigana
  // — don't double-wrap), and non-content tags. Inline <code> IS walked: in
  // this curriculum it wraps kana terms for typographic emphasis, not code.
  // <pre><code>...</code></pre> children are still skipped via the <pre> rule.
  const SKIP_TAGS = new Set(["PRE", "RUBY", "SCRIPT", "STYLE"]);

  function collectTextNodes(root) {
    const out = [];
    function walk(node) {
      if (node.nodeType === 3) { out.push(node); return; }
      if (node.nodeType !== 1) return;
      if (SKIP_TAGS.has(node.tagName)) return;
      for (const child of node.childNodes) walk(child);
    }
    walk(root);
    return out;
  }

  async function rubifyTextNode(node) {
    const text = node.nodeValue;
    if (!text || !KANA_OR_KANJI_RE.test(text)) return;
    let html;
    try {
      if (hasKanji(text)) {
        html = await renderWithKuroshiro(text);
      } else {
        html = renderWithWanakana(text);
      }
    } catch (err) {
      console.warn("Romaji render failed for segment:", err, text);
      return;
    }
    const wrapper = document.createElement("span");
    wrapper.innerHTML = html;
    // Replace the text node with the wrapper's children (no extra span layer).
    const parent = node.parentNode;
    if (!parent) return;
    while (wrapper.firstChild) {
      parent.insertBefore(wrapper.firstChild, node);
    }
    parent.removeChild(node);
  }

  // ──────────────────────────────────────────────────────────────
  // Toggle state
  // ──────────────────────────────────────────────────────────────
  let originalHtml = null;

  async function toggleOn() {
    if (originalHtml === null) originalHtml = article.innerHTML;
    setStatus("Loading romaji libs…");
    try {
      await waitForLib("wanakana");
      // Pre-load kuroshiro if any kanji exists in the article.
      if (hasKanji(article.textContent)) {
        await getKuroshiro();
      }
      const nodes = collectTextNodes(article);
      setStatus(`Adding ruby to ${nodes.length} text node(s)…`);
      let processed = 0;
      for (const node of nodes) {
        await rubifyTextNode(node);
        processed++;
        if (processed % 60 === 0) {
          setStatus(`Adding ruby… (${processed}/${nodes.length})`);
          await new Promise(r => setTimeout(r, 0));  // yield to UI
        }
      }
      setStatus("");
      toggleBtn.classList.add("on");
      toggleBtn.textContent = "Hide romaji";
      try { localStorage.setItem("romaji-on", "1"); } catch (_) {}
    } catch (err) {
      setStatus("Failed: " + err.message, true);
      throw err;
    }
  }

  function toggleOff() {
    if (originalHtml !== null) {
      article.innerHTML = originalHtml;
    }
    toggleBtn.classList.remove("on");
    toggleBtn.textContent = "Show romaji";
    setStatus("");
    try { localStorage.setItem("romaji-on", "0"); } catch (_) {}
  }

  toggleBtn.addEventListener("click", async () => {
    if (toggleBtn.disabled) return;
    if (toggleBtn.classList.contains("on")) {
      toggleOff();
      return;
    }
    toggleBtn.disabled = true;
    try {
      await toggleOn();
    } catch (_) {
      // status already set
    } finally {
      toggleBtn.disabled = false;
    }
  });

  // Auto-apply on page load unless explicitly disabled.
  // (Default: ON — romaji ruby everywhere by default. Click to hide.)
  let preferred = null;
  try { preferred = localStorage.getItem("romaji-on"); } catch (_) {}
  if (preferred !== "0") {
    toggleBtn.disabled = true;
    toggleOn().catch(() => {}).finally(() => { toggleBtn.disabled = false; });
  }
})();
</script>
</body>
</html>
